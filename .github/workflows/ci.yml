name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    env:
      RUN_LIVE_OPENAI_TESTS: "0"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Set up Node for UI regression tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install project with dev, perf, and eval dependencies
        run: pip install ".[dev,perf,eval]"

      - name: Run pytest
        run: python -m pytest -q

      - name: Run internal evaluation
        run: python -m evaluation.evaluate --dataset evaluation/sample_dataset.json --report reports/evaluation_report.md

      - name: Run external-style evaluation
        run: python -m evaluation.evaluate --dataset evaluation/external_validation_sample.json --report reports/external_validation_report.md
