services:
  mock-llm:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m uvicorn tools.mock_llm:app --host 0.0.0.0 --port 8001
    ports:
      - "127.0.0.1:8001:8001"

  proxy:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - MOCK_LLM_URL=http://mock-llm:8001/v1/chat/completions
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - UPSTREAM_TIMEOUT_SECONDS=10
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - OPENAI_TIMEOUT_SECONDS=${OPENAI_TIMEOUT_SECONDS:-30}
      - OPENAI_MAX_OUTPUT_TOKENS=${OPENAI_MAX_OUTPUT_TOKENS:-1000}
      - ENABLE_MODEL_DETECTOR=true
      - DETECTION_MODE=hybrid
      - MODEL_DETECTOR_THRESHOLD=0.70
      - MODEL_DETECTOR_FAIL_MODE=warn
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - mock-llm
