default_action: ALLOW
rules:
  PII_EMAIL_DETECTED:
    action: MASK
    priority: 60
    threshold: 0.7
    description: "Mask email address before forwarding to model."
  PII_PHONE_DETECTED:
    action: MASK
    priority: 70
    threshold: 0.7
    description: "Mask phone number for privacy."
  PII_ADDRESS_DETECTED:
    action: MASK
    priority: 82
    threshold: 0.8
    description: "Mask address details that frequently appear in civil-service requests."
  PII_RRN_DETECTED:
    action: BLOCK
    priority: 100
    threshold: 0.8
    description: "Block resident registration number exposure."
  PII_REQUEST_RRN:
    action: BLOCK
    priority: 101
    threshold: 0.8
    description: "Block requests asking for resident registration numbers even when no raw number is present."
  PII_EXFILTRATION_REQUEST:
    action: BLOCK
    priority: 95
    threshold: 0.8
    description: "Block requests asking for private or citizen data in original form."
  PII_ACCOUNT_DETECTED:
    action: WARN
    priority: 50
    threshold: 0.75
    description: "Account-number candidate. Context validation is applied because false positives are possible."
  MODEL_PII_RISK:
    action: WARN
    priority: 45
    threshold: 0.6
    description: "Optional lightweight model flagged contextual PII risk. Falls back to deterministic detectors when model artifacts are absent."
  INJ_IGNORE_PREVIOUS_INSTRUCTIONS:
    action: BLOCK
    priority: 90
    threshold: 5.0
    description: "Legacy alias for INJ_DIRECT_OVERRIDE_ATTEMPT. Kept for backward compatibility."
  INJ_DIRECT_OVERRIDE:
    action: BLOCK
    priority: 97
    threshold: 0.8
    description: "Block direct override requests that pair instruction-bypass phrasing with an exfiltration command."
  INJ_REVEAL_SYSTEM_PROMPT:
    action: BLOCK
    priority: 98
    threshold: 5.0
    description: "Block attempts to reveal system prompt."
  INJ_DIRECT_OVERRIDE_ATTEMPT:
    action: BLOCK
    priority: 96
    threshold: 5.0
    description: "Block attempts to override previous or higher-priority instructions."
  INJ_SYSTEM_PROMPT_EXTRACTION_ATTEMPT:
    action: BLOCK
    priority: 98
    threshold: 5.0
    description: "Block attempts to reveal system prompts or hidden instructions."
  INJ_RULE_DISCLOSURE_ATTEMPT:
    action: WARN
    priority: 75
    threshold: 3.0
    description: "Warn on requests to disclose internal rules or response criteria."
  INJ_ROLE_OVERRIDE_ATTEMPT:
    action: BLOCK
    priority: 94
    threshold: 5.0
    description: "Block attempts to redefine the assistant role."
  INJ_POLICY_BYPASS:
    action: BLOCK
    priority: 99
    threshold: 0.8
    description: "Block policy-bypass wording even when no explicit hidden-prompt term is present."
  INJ_POLICY_BYPASS_ATTEMPT:
    action: BLOCK
    priority: 90
    threshold: 5.0
    description: "Block policy bypass attempts."
  INJ_DEBUG_MODE_ATTEMPT:
    action: BLOCK
    priority: 93
    threshold: 5.0
    description: "Block attempts to enable debug, developer, admin, or audit modes."
  INJ_MULTI_STEP_EXTRACTION_ATTEMPT:
    action: WARN
    priority: 72
    threshold: 3.0
    description: "Warn on multi-step attempts to elicit hidden rules or criteria."
  INJ_OBFUSCATED_INJECTION_ATTEMPT:
    action: BLOCK
    priority: 99
    threshold: 3.0
    description: "Block obfuscated prompt injection attempts, including leetspeak or spaced system/hidden instruction terms."
  MODEL_INJECTION_RISK:
    action: WARN
    priority: 70
    threshold: 0.6
    description: "Optional lightweight model flagged contextual prompt-injection risk. Falls back to rule detection when model artifacts are absent."
  MODEL_DETECTOR_ERROR:
    action: WARN
    priority: 65
    threshold: 0.0
    description: "Model detector execution failed. Do not treat the request as SAFE_INPUT."
  MODEL_ARTIFACT_MISSING:
    action: WARN
    priority: 64
    threshold: 0.0
    description: "Model artifacts are missing. Record fallback usage explicitly instead of treating the detector as ALLOW."
  MODEL_UNAVAILABLE_FALLBACK_USED:
    action: WARN
    priority: 63
    threshold: 0.0
    description: "Model detector fallback was used because the optional lightweight model was unavailable."
  MODEL_DETECTOR_UNAVAILABLE:
    action: WARN
    priority: 62
    threshold: 0.0
    description: "Legacy unavailable status retained for backward compatibility."
  SAFE_INPUT:
    action: ALLOW
    priority: 0
    threshold: 0.0
    description: "No risky signal found."
